<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your STACKLY HOME account to track orders, save favorites, and access exclusive member benefits." />
  <title>Login — STACKLY HOME</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23C9A96E'/><text y='22' x='4' font-size='20'>🪑</text></svg>" />
</head>
<body>

  <div id="page-loader">
    <div class="loader-logo"><img src="images/logo-stackly.png" alt="STACKLY HOME" style="height:40px;width:auto;" /></div>
    <div class="loader-bar"></div>
  </div>

  <main class="auth-page" aria-label="Login page">
    <div class="auth-card" data-anim="fade-up">
      <div style="margin-bottom:1rem;">
        <a href="index.html" style="font-size:0.85rem;font-weight:600;color:var(--gray-500);display:inline-flex;align-items:center;gap:0.25rem;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Go Back
        </a>
      </div>
      <div class="auth-logo">
        <a href="index.html"><img src="images/logo-stackly.png" alt="STACKLY HOME Logo" style="height:36px;width:auto;" /></a>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to your account to access your orders and saved items.</p>

      <!-- Role Switch -->
      <div class="auth-switch-role" role="group" aria-label="Select account type">
        <button class="role-btn active" id="role-customer" onclick="switchRole('customer', this)">Customer</button>
        <button class="role-btn" id="role-admin" onclick="switchRole('admin', this)">Admin</button>
      </div>

      <form class="auth-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email" style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password" style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Your password" required autocomplete="current-password" />
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:-0.25rem;">
          <a href="404.html" style="font-size:0.82rem;color:var(--primary);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;font-size:1rem;padding:1rem;margin-top:0.5rem;" id="login-submit-btn">Sign In</button>
        <div class="auth-or">or</div>
        <a href="404.html" class="btn btn-outline-gold" style="width:100%;font-size:0.9rem;" id="login-google-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </a>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html" id="goto-signup">Sign up free</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let selectedRole = 'customer';

    function switchRole(role, btn) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      if (!email || !password) {
        showToast('Please fill in all fields.', 'warning');
        return;
      }

      btn.textContent = 'Signing in…';
      btn.disabled = true;

      setTimeout(() => {
        const name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        authLogin(name, email, selectedRole, password);
        showToast('Welcome back! Redirecting to your dashboard…', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
      }, 1000);
    });
  </script>
</body>
</html>
