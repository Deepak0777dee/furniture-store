      <form class="auth-form" id="signup-form">
        <div class="form-group">
          <label for="signup-name"
            style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Full
            Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="Your full name" required
            pattern="^[A-Za-z\s]+$" title="Name should only contain letters and spaces" autocomplete="name"
            oninput="this.value = this.value.replace(/[^A-Za-z\\s]/g, '')" />
          <div class="error-msg" id="signup-name-error"></div>
        </div>
        <div class="form-group">
          <label for="signup-email"
            style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Email
            Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="your@email.com" required
            autocomplete="email" />
          <div class="error-msg" id="signup-email-error"></div>
        </div>
        <div class="form-group">
          <label for="signup-password"
            style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Password</label>

        <div class="form-group">

            style="font-size:0.78rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;display:block;">Confirm

          <input type="password" id="signup-confirm" class="form-control" placeholder="Repeat your password" required
            autocomplete="new-password" />
          <div class="error-msg" id="signup-confirm-error"></div>
        </div>
        <div style="display:flex;align-items:flex-start;gap:0.5rem;margin-top:0.25rem;">

            <path fill="#34A853"

            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />

          </svg>
          Sign up with Google

      <div class="auth-footer">

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let selectedRole = 'customer';

    function switchRole(role, btn) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function showInlineError(id, msg) {
      const input = document.getElementById(id);
      const errorDiv = document.getElementById(id + '-error');
      if (input) input.classList.add('is-invalid');
      if (errorDiv) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; }
    }
    function clearInlineErrors() {
      document.querySelectorAll('.form-control.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
    }

    function showInlineError(id, msg) {
      const input = document.getElementById(id);
      const errorDiv = document.getElementById(id + '-error');
      if (input) input.classList.add('is-invalid');
      if (errorDiv) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; }
    }
    function clearInlineErrors() {
      document.querySelectorAll('.form-control.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
    }

    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      clearInlineErrors();

      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const terms = document.getElementById('signup-terms').checked;
      const btn = document.getElementById('signup-submit-btn');

      let isValid = true;
      if (!name) { showInlineError('signup-name', 'Please enter your full name.'); isValid = false; }
      else if (/[0-9]/.test(name)) { showInlineError('signup-name', 'Name cannot contain numbers.'); isValid = false; }

      if (!email) { showInlineError('signup-email', 'Please enter your email address.'); isValid = false; }
      else if (!/^\S+@\S+\.\S+$/.test(email)) { showInlineError('signup-email', 'Please enter a valid email address.'); isValid = false; }

      const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
      if (!password) { showInlineError('signup-password', 'Please enter a password.'); isValid = false; }
      else if (!passRegex.test(password)) {
        showInlineError('signup-password', 'Password must be at least 8 chars, with 1 uppercase, 1 lowercase, 1 number, and 1 special char (e.g., John@123).');
        isValid = false;
      }

      if (password !== confirm) { showInlineError('signup-confirm', 'Passwords do not match.'); isValid = false; }
      if (!terms) { showInlineError('signup-terms', 'Please accept the Terms of Service.'); isValid = false; }

      if (!isValid) return;

      btn.textContent = 'Creating account…';
      btn.disabled = true;

      setTimeout(() => {
        authSignup(name, email, selectedRole, password);
        showToast('Account created successfully! Please sign in.', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      }, 1000);
    });
  </script>
